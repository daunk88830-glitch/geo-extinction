[build]
  # 배포할 때마다 data-raw/ 에서 학생용 데이터를 다시 만듭니다.
  # 교사용 원본을 고치고 npm run data 를 깜빡해도 정답표가 섞여 나가지 않습니다.
  command = "npm run data && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 해시 라우터를 쓰므로 모든 경로를 index.html 로 돌려보냅니다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
